<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Statistics</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4 text-primary">Department Employee Statistics</h2>

    <!-- Tổng số nhân viên -->
    <div class="alert alert-info text-center font-weight-bold">
        Total Employees: <span th:text="${totalEmployees}"></span>
    </div>

    <!-- Bảng thống kê -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-bordered table-hover table-striped mb-0">
                <thead class="thead-dark">
                <tr>
                    <th class="text-center">#</th>
                    <th>Department Name</th>
                    <th class="text-center">Employee Count</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="stat, iterStat : ${statistics}">
                    <td class="text-center" th:text="${iterStat.index + 1}"></td>
                    <td th:text="${stat.departmentName}"></td>
                    <td class="text-center" th:text="${stat.employeeCount}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(statistics)}">
                    <td colspan="3" class="text-center text-muted">No data available</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Nút quay lại -->
    <div class="text-center mt-4">
        <a th:href="@{/employees}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Font Awesome (icon optional) -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
