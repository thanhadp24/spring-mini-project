<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1 class="mb-4">Employee List</h1>
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <a class="btn btn-success" th:href="@{/employees/new}">Create Employee</a>
        <a class="btn btn-primary" th:href="@{/employees/statistics}">Statistics</a>
    </div>
    <form th:action="@{/employees/search}" method="get" class="d-flex">
        <input type="text" name="name" placeholder="Search by name or department" class="form-control me-2" />
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
</div>
<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>
        <td th:text="${employee.name}"></td>
        <td th:text="${employee.email}"></td>
        <td th:text="${employee.department.name}"></td>
    </tr>
    </tbody>
</table>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
