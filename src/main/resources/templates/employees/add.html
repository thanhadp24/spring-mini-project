<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
            <h3>Add Employee</h3>
        </div>

        <div class="card-body">
            <form th:action="@{/employees/save}" th:object="${employee}" method="post">

                <!-- Hidden ID for edit cases -->
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control"
                           placeholder="Enter full name" />
                    <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}" class="form-control"
                           placeholder="email@example.com" />
                    <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                </div>

                <div class="form-group">
                    <label for="departmentId">Department</label>
                    <select id="departmentId" th:field="*{departmentId}" class="form-control">
                        <option value="" disabled selected>Select Department</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                    </select>
                    <small class="text-danger" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></small>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success px-4 mr-2">Save</button>
                    <a th:href="@{/employees}" class="btn btn-secondary px-4">Cancel</a>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-smHYkdvP+KciO3nFZ5a2Fw5n+S6v6Uqj1DZ8lY2IMqI3zU6x1BvQnM6N5p9ujhOz"
        crossorigin="anonymous"></script>
</body>
</html>
